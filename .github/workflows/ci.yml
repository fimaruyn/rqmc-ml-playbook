# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  IMAGE_NAME: rqmc-ml-playbook
  DOCKER_BUILDKIT: 1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check src/ tests/ scripts/ --output-format=github

      - name: Run type checker (mypy)
        run: mypy src/ scripts/

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Verify core imports in container
        run: |
          docker run --rm $IMAGE_NAME:latest -c "
          import rqmc_ml_playbook, numpy, scipy, pandas, salib, loguru, matplotlib, yaml
          print('✅ All core imports successful in CI container')
          "

      - name: Run tests in container
        run: |
          docker run --rm -v ${{ github.workspace }}:/app $IMAGE_NAME:latest -m pytest tests/ -v

      - name: Verify PDF compilation
        run: |
          docker run --rm -v ${{ github.workspace }}:/app $IMAGE_NAME:latest -c "
          import subprocess
          result = subprocess.run(['latexmk', '-pdf', '-interaction=nonstopmode', 'theory/main.tex'], cwd='/app/theory')
          assert result.returncode == 0, 'PDF compilation failed'
          print('✅ PDF compilation successful')
          "