[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqmc-ml-playbook"
version = "0.1.0"
description = "A reproducible research playbook on Randomized Quasi-Monte Carlo methods for high-dimensional integration in ML"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Vladimir Belov", email = "vladimir.belov.an@gmail.com" }
]
keywords = [
    "quasi-monte carlo",
    "randomized qmc",
    "high-dimensional integration",
    "effective dimensionality",
    "variance reduction",
    "reproducible research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.12.0",
    "salib>=1.4.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",  # Required for scripts/verify_setup.py (disk usage checks)
]

[project.optional-dependencies]
ml-jax = ["jax>=0.4.28", "jaxlib>=0.4.28"]
ml-torch = ["torch>=2.2.0", "torchvision>=0.17.0"]
notebooks = ["jupyterlab>=4.0.0", "ipywidgets>=8.1.0", "nbformat>=5.9.0"]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "types-psutil>=0.1.0",  # Type stubs for psutil (mypy support)
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rqmc_ml_playbook*"]

# ===== RUFF CONFIGURATION (modern format) =====
[tool.ruff]
target-version = "py312"
line-length = 100

# Linting rules (migrated from top-level to [tool.ruff.lint])
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # Line length handled by formatter

# Formatting settings
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Optional: Exclude scripts/ from strict linting if needed
# [tool.ruff.lint.per-file-ignores]
# "scripts/*" = ["E501", "B007"]

# ===== MYPY CONFIGURATION =====
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Relax checks for utility scripts (pragmatic approach for research code)
[[tool.mypy.overrides]]
module = ["scripts.*"] 
disallow_untyped_defs = false
ignore_missing_imports = true

# ===== PYTEST CONFIGURATION =====
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]