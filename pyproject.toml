[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqmc-ml-playbook"
version = "0.1.0"
description = "A reproducible research playbook on Randomized Quasi-Monte Carlo methods for high-dimensional integration in ML"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Vladimir Belov", email = "vladimir.belov.an@gmail.com"}
]
keywords = [
    "quasi-monte carlo", "randomized qmc", "high-dimensional integration",
    "effective dimensionality", "variance reduction", "reproducible research"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.12.0",
    "salib>=1.4.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
ml-jax = ["jax>=0.4.28", "jaxlib>=0.4.28"]
ml-torch = ["torch>=2.2.0", "torchvision>=0.17.0"]
notebooks = ["jupyterlab>=4.0.0", "ipywidgets>=8.1.0", "nbformat>=5.9.0"]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rqmc_ml_playbook*"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --strict-markers"